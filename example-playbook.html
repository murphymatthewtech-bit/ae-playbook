  nav button.active { color:var(--navy); border-bottom:3px solid var(--navy); }
  main { max-width:1000px; margin:0 auto; padding:24px 32px 60px; }
  section { display:none; }
  section.active { display:block; }
  h2 { color:var(--navy); border-bottom:2px solid var(--light); padding-bottom:6px; }
  .card { background:#fff; border:1px solid #e2e2e2; border-radius:8px; padding:16px 20px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card h3 { margin-top:0; color:var(--navy); }
  .tag { display:inline-block; font-size:11px; font-weight:bold; padding:2px 8px; border-radius:10px; margin-left:8px; }
  .tag.confirmed, .tag.verified { background:var(--good); color:#256029; }
  .tag.hypothesis, .tag.inferred { background:var(--amber); color:#7a5c00; }
  .tag.unknown { background:var(--bad); color:#a13a3a; }
  table { width:100%; border-collapse:collapse; margin-bottom:16px; background:#fff; }
  th { background:var(--navy); color:#fff; text-align:left; padding:10px; font-size:13px; }
  td { padding:10px; border-bottom:1px solid #eee; font-size:13px; vertical-align:top; }
  .grid-2col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width: 720px) { .grid-2col { grid-template-columns: 1fr; } nav button { min-width:33%; } main { padding:20px 14px 50px; } }
  .thesis-box { background:#fff; border:2px solid var(--navy); border-radius:10px; padding:20px 24px; margin-bottom:16px; }
  .thesis-row { margin-bottom:12px; }
  .thesis-row .label { font-weight:bold; color:var(--navy); font-size:13px; text-transform:uppercase; letter-spacing:.03em; display:block; margin-bottom:3px; }
  .thesis-row .value { font-size:15px; }
  .mini-field { margin-bottom:6px; font-size:13px; }
  .mini-field .k { font-weight:bold; color:var(--navy); }
  .persona-btn { background:var(--light); border:1px solid #b8c9e8; border-radius:6px; padding:8px 14px; margin:4px 6px 4px 0; cursor:pointer; font-weight:bold; color:var(--navy); }
  .persona-btn.active { background:var(--navy); color:#fff; }
  .persona-panel { display:none; margin-top:12px; }
  .persona-panel.active { display:block; }
  .source-list { font-size:12px; color:var(--grey); }
  .source-list li { margin-bottom:6px; word-break:break-all; }
  ul { padding-left:20px; }
  .email-box { background:#fbfbfb; border:1px dashed #bbb; padding:14px 18px; border-radius:6px; white-space:pre-wrap; font-size:13px; }
  .subtab-row { margin-bottom:14px; }
  .subtab-btn { background:#eef2f9; border:1px solid #ccd7ea; border-radius:6px; padding:6px 12px; margin:2px 6px 2px 0; cursor:pointer; font-weight:bold; color:var(--navy); font-size:12px; }
  .subtab-btn.active { background:var(--navy); color:#fff; }
  .subtab-panel { display:none; }
  .subtab-panel.active { display:block; }

      "text": "Iterable reviews — Capterra",
      "url": "https://capterra.com/p/143902/Iterable/reviews/"
    },
    {
      "text": "Klaviyo reviews — G2",
      "url": "https://www.g2.com/products/klaviyo/reviews"
    },
    {
      "text": "Blueshift reviews — G2",
      "url": "https://www.g2.com/products/blueshift/reviews?qs=pros-and-cons"
    },
    {
      "text": "Discovery/outreach style adapted from Kevin Dorsey's problem-bucket-question, disarming cold-open, and ask-for-interest-CTA methodology — Live Better. Sell Better. / 30 Minutes to President's Club",
      "url": null
    }
  ]
};

function el(tag, attrs={}, children=[]) {
  const e = document.createElement(tag);
  for (const k in attrs) { if (k === "text") e.textContent = attrs[k]; else if (k === "html") e.innerHTML = attrs[k]; else e.setAttribute(k, attrs[k]); }
  children.forEach(c => e.appendChild(c));
  return e;
}

function renderThesis(d) {
  const s = el("section", {id:"panel-thesis"});
  s.appendChild(el("h2", {text:"Account Thesis — my read, not just the research"}));
  const box = el("div", {class:"thesis-box"});
  const rows = [
    ["Why pursue", d.thesis.whyPursue],
    ["Why now", d.thesis.whyNow],
    ["Strongest single use case", d.thesis.strongestUseCase],
    ["Most likely reason this fails", d.thesis.likelyFailureReason],
    ["First contact, and why", d.thesis.firstContact],
    ["The one question I need answered before investing more time", d.thesis.keyQuestion],
    ["Recommended next action", d.thesis.recommendedAction],
  ];
  rows.forEach(([label, value]) => {
    const r = el("div", {class:"thesis-row"});
    r.appendChild(el("span", {class:"label", text:label}));
    r.appendChild(el("span", {class:"value", text:value}));
    box.appendChild(r);
  });
  s.appendChild(box);
  return s;
}

function renderSnapshot(d) {
  const s = el("section", {id:"panel-snapshot"});
  s.appendChild(el("h2", {text:"Account Snapshot"}));
  d.snapshot.forEach(row => {
    const c = el("div", {class:"card"});
    c.appendChild(el("h3", {text: row.label}));
    c.appendChild(el("p", {text: row.value}));
    if (row.source) c.appendChild(el("div", {class:"source-list", text:"Source: " + row.source}));
    s.appendChild(c);
  });
  return s;
}

function renderIncumbent(d) {
  const s = el("section", {id:"panel-incumbent"});
  s.appendChild(el("h2", {text:"Incumbent / Current-Tool Detection"}));
  const c = el("div", {class:"card"});
  c.appendChild(el("h3", {text: d.incumbent.summary}));
  c.appendChild(el("span", {class:"tag " + d.incumbent.confidenceLevel, text: d.incumbent.confidenceLabel}));
  const ul = el("ul");
  d.incumbent.evidence.forEach(ev => {
    const li = el("li", {text: ev.point + "  —  " + ev.source});
    ul.appendChild(li);
  });
  c.appendChild(ul);
  s.appendChild(c);
  return s;
}

function renderBattlecard(d) {
  const s = el("section", {id:"panel-battlecard"});
  s.appendChild(el("h2", {text:"Competitive Battlecard — deal-specific, not generic"}));
  d.battlecard.forEach(comp => {
    const c = el("div", {class:"card"});
    c.appendChild(el("h3", {text: comp.name + "  —  " + comp.positioning}));
    c.appendChild(el("p", {text: "Pricing: " + comp.pricing + "   |   Rating: " + comp.rating}));
    const grid = el("div", {class:"grid-2col"});
    const left = el("div");
    [["Likelihood they're the incumbent", comp.incumbentLikelihood],
     ["Likelihood they win this deal", comp.winLikelihood],
     ["Why this prospect might prefer them", comp.whyTheyMightPrefer]].forEach(([k,v]) => {
      const f = el("div", {class:"mini-field"});
      f.appendChild(el("span", {class:"k", text: k + ": "}));
      f.appendChild(document.createTextNode(v));
      left.appendChild(f);
    });
    const right = el("div");
    [["Customer.io's wedge here", comp.wedge],
     ["Discovery question that exposes the difference", comp.discoveryQuestion],
     ["When not to compete", comp.whenNotToCompete],
     ["Proof point to use", comp.proofPoint]].forEach(([k,v]) => {
      const f = el("div", {class:"mini-field"});
      f.appendChild(el("span", {class:"k", text: k + ": "}));
      f.appendChild(document.createTextNode(v));
      right.appendChild(f);
    });
    grid.appendChild(left); grid.appendChild(right);
    c.appendChild(grid);
    if (comp.source) c.appendChild(el("div", {class:"source-list", text:"Source: " + comp.source}));
    s.appendChild(c);
  });
  return s;
}

function renderStakeholders(d) {
  const s = el("section", {id:"panel-stakeholders"});
  s.appendChild(el("h2", {text:"Stakeholder Map"}));
  s.appendChild(el("p", {text:"Role-based, not named individuals — no specific person is claimed without a verified public source.", style:"font-size:12px;color:#595959;font-style:italic;"}));
  d.stakeholders.forEach(st => {
    const c = el("div", {class:"card"});
    c.appendChild(el("h3", {text: st.role}));
    [["Likely responsibility", st.likelyResponsibility],
     ["Relevant public signal", st.publicSignal],
     ["Likely priorities", st.priorities],
     ["Influence / decision power", st.influence],
     ["Relationship to other stakeholders", st.relationshipToOthers],
     ["Why contact them", st.whyContact],
     ["Message that would land", st.relevantMessage]].forEach(([k,v]) => {
      const f = el("div", {class:"mini-field"});
      f.appendChild(el("span", {class:"k", text: k + ": "}));
      f.appendChild(document.createTextNode(v));
      c.appendChild(f);
    });
    s.appendChild(c);
  });
  return s;
}

function renderMeddpicc(d) {
  const s = el("section", {id:"panel-meddpicc"});
  s.appendChild(el("h2", {text:"MEDDPICC — gap checklist with confidence + next action"}));
  const table = el("table");
  const thead = el("tr");
  ["Element","Known from Research","To Confirm","Confidence","Next Action"].forEach(h => thead.appendChild(el("th", {text:h})));
  table.appendChild(thead);
  d.meddpicc.forEach(row => {
    const tr = el("tr");
    tr.appendChild(el("td", {text: row.letter + " — " + row.label}));
    tr.appendChild(el("td", {text: row.known}));
    tr.appendChild(el("td", {text: row.toConfirm}));
    const confCell = el("td");
    confCell.appendChild(el("span", {class:"tag " + row.confidence.toLowerCase(), text: row.confidence}));
    tr.appendChild(confCell);
    tr.appendChild(el("td", {text: row.nextAction}));
    table.appendChild(tr);
  });
  s.appendChild(table);
  return s;
}

function renderPersonas(d) {
  const s = el("section", {id:"panel-personas"});
  s.appendChild(el("h2", {text:"Objection Tree by Buyer Persona"}));
  const btnRow = el("div");
  const panelHost = el("div");
  d.personas.forEach((p, i) => {
    const btn = el("button", {class:"persona-btn" + (i===0?" active":""), text:p.name});
    btn.onclick = () => {
      btnRow.querySelectorAll(".persona-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      panelHost.querySelectorAll(".persona-panel").forEach(pp => pp.classList.remove("active"));
      document.getElementById("persona-" + i).classList.add("active");
    };
    btnRow.appendChild(btn);
    const panel = el("div", {class:"persona-panel" + (i===0?" active":""), id:"persona-" + i});
    panel.appendChild(el("p", {text: p.description}));
    p.objections.forEach(o => {
      const c = el("div", {class:"card"});
      c.appendChild(el("h3", {text:"\"" + o.objection + "\""}));
      c.appendChild(el("p", {text: o.rebuttal}));
      panel.appendChild(c);
    });
    panelHost.appendChild(panel);
  });
  s.appendChild(btnRow);
  s.appendChild(panelHost);
  return s;
}

function renderDiscovery(d) {
  const s = el("section", {id:"panel-discovery"});
  s.appendChild(el("h2", {text:"Discovery Questions"}));
  const ul = el("ul");
  d.discoveryQuestions.forEach(q => ul.appendChild(el("li", {text:q})));
  s.appendChild(ul);
  return s;
}

function renderOutreach(d) {
  const s = el("section", {id:"panel-outreach"});
  s.appendChild(el("h2", {text:"Outreach — by channel, not one script pasted everywhere"}));
  const btnRow = el("div", {class:"subtab-row"});
  const panelHost = el("div");
  const items = [
    ["email", "Cold Email", () => {
      const c = el("div", {class:"card"});
      c.appendChild(el("h3", {text: d.outreach.coldEmail.subject}));
      c.appendChild(el("div", {class:"email-box", text: d.outreach.coldEmail.body}));
      return c;
    }],
    ["linkedin", "LinkedIn Message", () => {
      const c = el("div", {class:"card"});
      c.appendChild(el("div", {class:"email-box", text: d.outreach.linkedin.body}));
      return c;
    }],
    ["call", "Cold-Call Opener", () => {
      const c = el("div", {class:"card"});
      c.appendChild(el("div", {class:"email-box", text: d.outreach.callOpener.body}));
      return c;
    }],
    ["cadence", "Multi-Touch Cadence", () => {
      const table = el("table");
      const thead = el("tr"); ["Day","Channel","Action"].forEach(h => thead.appendChild(el("th",{text:h}))); table.appendChild(thead);
      d.outreach.cadence.forEach(row => {
        const tr = el("tr");
        tr.appendChild(el("td", {text: row.day}));
        tr.appendChild(el("td", {text: row.channel}));
        tr.appendChild(el("td", {text: row.action}));
        table.appendChild(tr);
      });
      return table;
    }],
  ];
  items.forEach(([id, label, renderFn], i) => {
    const btn = el("button", {class:"subtab-btn" + (i===0?" active":""), text:label});
    const panel = el("div", {class:"subtab-panel" + (i===0?" active":""), id:"outreach-"+id});
    panel.appendChild(renderFn());
    btn.onclick = () => {
      btnRow.querySelectorAll(".subtab-btn").forEach(b=>b.classList.remove("active"));
      panelHost.querySelectorAll(".subtab-panel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      panel.classList.add("active");
    };
    btnRow.appendChild(btn);
    panelHost.appendChild(panel);
  });
  s.appendChild(btnRow);
  s.appendChild(panelHost);
  return s;
}

function renderSources(d) {
  const s = el("section", {id:"panel-sources"});
  s.appendChild(el("h2", {text:"Sources"}));
  const ul = el("ul", {class:"source-list"});
  d.sources.forEach(src => {
    const li = el("li");
    if (src.url) {
      const a = el("a", {href: src.url, target:"_blank", rel:"noopener", text: src.text});
      li.appendChild(a);
    } else {
      li.textContent = src.text;
    }
    ul.appendChild(li);
  });
  s.appendChild(ul);
  return s;
}

function build() {
  const d = PLAYBOOK_DATA;
  document.getElementById("hdr-title").textContent = "Account Playbook — " + d.meta.targetCompany;
  document.getElementById("hdr-sub").textContent = "Prospect for " + d.meta.sellerCompany + "  •  Prepared by " + d.meta.preparedBy + "  •  " + d.meta.date;
  document.getElementById("hdr-tier").textContent = d.meta.tier;
  const tabs = [
    ["thesis","Thesis", renderThesis],
    ["snapshot","Snapshot", renderSnapshot],
    ["incumbent","Incumbent", renderIncumbent],
    ["battlecard","Battlecard", renderBattlecard],
    ["stakeholders","Stakeholders", renderStakeholders],
    ["meddpicc","MEDDPICC", renderMeddpicc],
    ["personas","Objections", renderPersonas],
    ["discovery","Discovery Qs", renderDiscovery],
    ["outreach","Outreach", renderOutreach],
    ["sources","Sources", renderSources],
  ];
  const nav = document.getElementById("tabs");
  const panels = document.getElementById("panels");
  tabs.forEach(([id,label,fn], i) => {
    const btn = el("button", {text:label, class: i===0?"active":""});
    const panel = fn(d);
    panel.classList.toggle("active", i===0);
    btn.onclick = () => {
      nav.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      panels.querySelectorAll("section").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      panel.classList.add("active");
    };
    nav.appendChild(btn);
    panels.appendChild(panel);
  });
}
build();
</script>
</body>
