<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDR Outbound &amp; AI Agent Playbook</title>
<style>
  :root { --navy:#1F3864; --light:#D9E2F3; --grey:#595959; --good:#E2EFDA; --bad:#FCE4E4; --amber:#FFF3CD; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; margin:0; background:#f4f6fb; color:#1a1a1a; }
  header { background:var(--navy); color:#fff; padding:20px 32px; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:6px 0 0; color:#c9d6ee; font-size:13px; }
  .tier-badge { display:inline-block; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.35); border-radius:12px; padding:2px 10px; font-size:11px; font-weight:bold; margin-top:8px; }
  nav { display:flex; flex-wrap:wrap; background:#fff; border-bottom:1px solid #ddd; position:sticky; top:0; z-index:10; }
  nav button { flex:1; min-width:100px; padding:12px 6px; border:none; background:none; cursor:pointer; font-size:12px; font-weight:bold; color:var(--grey); border-bottom:3px solid transparent; }
  nav button.active { color:var(--navy); border-bottom:3px solid var(--navy); }
  main { max-width:1000px; margin:0 auto; padding:24px 32px 60px; }
  section { display:none; }
  section.active { display:block; }
  h2 { color:var(--navy); border-bottom:2px solid var(--light); padding-bottom:6px; }
  .card { background:#fff; border:1px solid #e2e2e2; border-radius:8px; padding:16px 20px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card h3 { margin-top:0; color:var(--navy); }
  .tag { display:inline-block; font-size:11px; font-weight:bold; padding:2px 8px; border-radius:10px; margin-left:8px; }
  .tag.confirmed, .tag.verified { background:var(--good); color:#256029; }
  .tag.hypothesis, .tag.inferred { background:var(--amber); color:#7a5c00; }
  .tag.unknown { background:var(--bad); color:#a13a3a; }
  table { width:100%; border-collapse:collapse; margin-bottom:16px; background:#fff; }
  th { background:var(--navy); color:#fff; text-align:left; padding:10px; font-size:13px; }
  td { padding:10px; border-bottom:1px solid #eee; font-size:13px; vertical-align:top; }
  .grid-2col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width: 720px) { .grid-2col { grid-template-columns: 1fr; } nav button { min-width:33%; } main { padding:20px 14px 50px; } }
  .thesis-box { background:#fff; border:2px solid var(--navy); border-radius:10px; padding:20px 24px; margin-bottom:16px; }
  .thesis-row { margin-bottom:12px; }
  .thesis-row .label { font-weight:bold; color:var(--navy); font-size:13px; text-transform:uppercase; letter-spacing:.03em; display:block; margin-bottom:3px; }
  .thesis-row .value { font-size:15px; }
  .mini-field { margin-bottom:6px; font-size:13px; }
  .mini-field .k { font-weight:bold; color:var(--navy); }
  .source-list { font-size:12px; color:var(--grey); }
  .source-list li { margin-bottom:6px; word-break:break-all; }
  ul { padding-left:20px; }
  .prompt-box { background:#0f1b33; color:#dfe8fb; border-radius:8px; padding:18px 22px; white-space:pre-wrap; font-family:"SF Mono",Consolas,monospace; font-size:12.5px; line-height:1.6; }
  .subtab-row { margin-bottom:14px; }
  .subtab-btn { background:#eef2f9; border:1px solid #ccd7ea; border-radius:6px; padding:6px 12px; margin:2px 6px 2px 0; cursor:pointer; font-weight:bold; color:var(--navy); font-size:12px; }
  .subtab-btn.active { background:var(--navy); color:#fff; }
  .subtab-panel { display:none; }
  .subtab-panel.active { display:block; }
  .day-badge { display:inline-block; background:var(--light); color:var(--navy); font-weight:bold; font-size:11px; padding:3px 9px; border-radius:10px; margin-right:8px; }
</style>
</head>
<body>
<div style="background:#FCE4E4;border-bottom:2px solid #c62828;padding:10px 24px;font-family:Arial,sans-serif;font-size:13px;color:#7a1f1f;">
<strong>Illustrative public version:</strong> this example is adapted from a real SDR Agent Manager job application. The target company's name and some identifying details have been altered for public portfolio sharing; the framework, structure, and reasoning shown are unchanged.
</div>

  <p id="hdr-sub"></p>
  <span class="tier-badge" id="hdr-tier"></span>
</header>
<nav id="tabs"></nav>
<main id="panels"></main>

function el(tag, attrs={}, children=[]) {
  const e = document.createElement(tag);
  for (const k in attrs) { if (k === "text") e.textContent = attrs[k]; else if (k === "html") e.innerHTML = attrs[k]; else e.setAttribute(k, attrs[k]); }
  children.forEach(c => e.appendChild(c));
  return e;
}

function renderThesis(d) {
  const s = el("section", {id:"panel-thesis"});
  s.appendChild(el("h2", {text:"Manager's Thesis: how I'd approach this role"}));
  const box = el("div", {class:"thesis-box"});
  const rows = [
    ["Why this role", d.thesis.whyThisRole],
    ["My approach to the human plus AI blend", d.thesis.approach],
    ["Strongest point of leverage", d.thesis.strongestLeverage],
    ["Most likely reason this is hard", d.thesis.likelyChallenge],
    ["First priority in the first two weeks", d.thesis.firstPriority],
    ["The one open question that matters most", d.thesis.keyQuestion],
    ["Recommended first move", d.thesis.recommendedFirstMove],
  ];
  rows.forEach(([label, value]) => {
    const r = el("div", {class:"thesis-row"});
    r.appendChild(el("span", {class:"label", text:label}));
    r.appendChild(el("span", {class:"value", text:value}));
    box.appendChild(r);
  });
  s.appendChild(box);
  return s;
}

function renderPersonas(d) {
  const s = el("section", {id:"panel-personas"});
  s.appendChild(el("h2", {text:"Buyer Personas"}));
  d.personas.forEach(p => {
    const c = el("div", {class:"card"});
    c.appendChild(el("h3", {text: p.role}));
    [["Likely title", p.likelyTitle],
     ["Priorities", p.priorities],
     ["Pain points", p.painPoints],
     ["What lands with them", p.whatLands],
     ["Preferred channel", p.channel],
     ["Typical first objection", p.typicalObjection]].forEach(([k,v]) => {
      const f = el("div", {class:"mini-field"});
      f.appendChild(el("span", {class:"k", text: k + ": "}));
      f.appendChild(document.createTextNode(v));
      c.appendChild(f);
    });
    s.appendChild(c);
  });
  return s;
}

function renderCadence(d) {
  const s = el("section", {id:"panel-cadence"});
  s.appendChild(el("h2", {text:"Outbound Cadence"}));
  const table = el("table");
  const thead = el("tr");
  ["Day","Channel","Action","Purpose"].forEach(h => thead.appendChild(el("th", {text:h})));
  table.appendChild(thead);
  d.cadence.forEach(row => {
    const tr = el("tr");
    tr.appendChild(el("td", {html: '<span class="day-badge">Day ' + row.day + '</span>'}));
    tr.appendChild(el("td", {text: row.channel}));
    tr.appendChild(el("td", {text: row.action}));
    tr.appendChild(el("td", {text: row.purpose}));
    table.appendChild(tr);
  });
  s.appendChild(table);
  return s;
}

function renderObjections(d) {

    list.forEach(o => {
      const c = el("div", {class:"card"});
      c.appendChild(el("h3", {text:"\"" + o.objection + "\""}));
      c.appendChild(el("p", {text: o.rebuttal}));
      panel.appendChild(c);
    });
    btn.onclick = () => {
      btnRow.querySelectorAll(".subtab-btn").forEach(b=>b.classList.remove("active"));
      panelHost.querySelectorAll(".subtab-panel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      panel.classList.add("active");
    };
    btnRow.appendChild(btn);
    panelHost.appendChild(panel);
  });
  s.appendChild(btnRow);
  s.appendChild(panelHost);
  return s;
}

function renderAgentPrompt(d) {
  const s = el("section", {id:"panel-agentprompt"});
  s.appendChild(el("h2", {text:"AI Agent Operating Instructions"}));
  s.appendChild(el("p", {text: d.agentPrompt.intro, style:"font-size:13px;color:#595959;font-style:italic;"}));
  const c = el("div", {class:"card"});
  c.appendChild(el("h3", {text:"System prompt (v1)"}));
  c.appendChild(el("div", {class:"prompt-box", text: d.agentPrompt.systemPrompt}));
  s.appendChild(c);

  const rules = el("div", {class:"card"});
  rules.appendChild(el("h3", {text:"Tone rules"}));
  const ul1 = el("ul");
  d.agentPrompt.toneRules.forEach(r => ul1.appendChild(el("li", {text:r})));
  rules.appendChild(ul1);
  s.appendChild(rules);

  const never = el("div", {class:"card"});
  never.appendChild(el("h3", {text:"The agent never"}));
  const ul2 = el("ul");
  d.agentPrompt.neverDo.forEach(r => ul2.appendChild(el("li", {text:r})));
  never.appendChild(ul2);
  s.appendChild(never);

  const esc = el("div", {class:"card"});
  esc.appendChild(el("h3", {text:"Escalate to a human when"}));
  const ul3 = el("ul");
  d.agentPrompt.escalation.forEach(r => ul3.appendChild(el("li", {text:r})));
  esc.appendChild(ul3);
  s.appendChild(esc);

  const ab = el("div", {class:"card"});
  ab.appendChild(el("h3", {text:"A/B test protocol"}));
  ab.appendChild(el("p", {text: d.agentPrompt.abTest}));
  s.appendChild(ab);
  return s;
}

function renderPerformance(d) {
  const s = el("section", {id:"panel-performance"});
  s.appendChild(el("h2", {text:"Performance & Optimization Framework"}));
  const table = el("table");
  const thead = el("tr");
  ["Metric","Definition","Why it matters"].forEach(h => thead.appendChild(el("th", {text:h})));
  table.appendChild(thead);
  d.performance.metrics.forEach(row => {
    const tr = el("tr");
    tr.appendChild(el("td", {text: row.metric}));
    tr.appendChild(el("td", {text: row.definition}));
    tr.appendChild(el("td", {text: row.why}));
    table.appendChild(tr);
  });
  s.appendChild(table);

  const loop = el("div", {class:"card"});
  loop.appendChild(el("h3", {text:"The optimization loop"}));
  loop.appendChild(el("p", {text: d.performance.optimizationLoop}));
  s.appendChild(loop);

  const exp = el("div", {class:"card"});
  exp.appendChild(el("h3", {text:"Experiment backlog"}));
  const ul = el("ul");
  d.performance.experiments.forEach(e => ul.appendChild(el("li", {text: e.hypothesis + ". Test: " + e.test + ". Measure: " + e.measure})));
  exp.appendChild(ul);
  s.appendChild(exp);
  return s;
}

function renderPlan(d) {
  const s = el("section", {id:"panel-plan"});
  s.appendChild(el("h2", {text:"30-60-90 Day Plan"}));
  [["First 30 days", d.plan.day30],["Days 31-60", d.plan.day60],["Days 61-90", d.plan.day90]].forEach(([label, text]) => {
    const c = el("div", {class:"card"});
    c.appendChild(el("h3", {text:label}));
    c.appendChild(el("p", {text}));
    s.appendChild(c);
  });
  return s;
}

function renderSources(d) {
  const s = el("section", {id:"panel-sources"});
  s.appendChild(el("h2", {text:"Sources"}));
  const ul = el("ul", {class:"source-list"});
  d.sources.forEach(src => {
    const li = el("li");
    if (src.url) {
      const a = el("a", {href: src.url, target:"_blank", rel:"noopener", text: src.text});
      li.appendChild(a);
    } else {
      li.textContent = src.text;
    }
    ul.appendChild(li);
  });
  s.appendChild(ul);
  return s;
}

function build() {
  const d = SDR_DATA;
  document.getElementById("hdr-title").textContent = "SDR Outbound & AI Agent Playbook: " + d.meta.company;
  document.getElementById("hdr-sub").textContent = "Role: " + d.meta.role + "  •  Prepared by " + d.meta.candidate + "  •  " + d.meta.date;
  document.getElementById("hdr-tier").textContent = d.meta.tier;
  const tabs = [
    ["thesis","Thesis", renderThesis],
    ["personas","Personas", renderPersonas],
    ["cadence","Cadence", renderCadence],
    ["objections","Objections", renderObjections],
    ["agentprompt","AI Agent Prompt", renderAgentPrompt],
    ["performance","Performance", renderPerformance],
    ["plan","30-60-90 Plan", renderPlan],
    ["sources","Sources", renderSources],
  ];
  const nav = document.getElementById("tabs");
  const panels = document.getElementById("panels");
  tabs.forEach(([id,label,fn], i) => {
    const btn = el("button", {text:label, class: i===0?"active":""});
    const panel = fn(d);
    panel.classList.toggle("active", i===0);
    btn.onclick = () => {
      nav.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      panels.querySelectorAll("section").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      panel.classList.add("active");
    };
    nav.appendChild(btn);
    panels.appendChild(panel);
  });
}
build();
</script>
</body>
</html>
